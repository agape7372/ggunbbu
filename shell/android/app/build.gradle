apply plugin: 'com.android.application'

// levain 셸 정본 이식(08-30): key.properties 기반 서명 — 파일 없으면 조용히 스킵(디버그 빌드 영향 0)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 릴리스 산출물(assembleRelease·bundleRelease)은 key.properties 없이 굽지 않는다 — 없으면 위 서명 설정이 조용히 빠져
// 무서명 AAB가 나오고 Play 업로드에서야 발각된다. 디버그 빌드·동기화는 영향 없음.
// Android Studio 「Generate Signed Bundle」은 서명 정보를 -P 로 주입하므로 통과시킨다.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(?i)(assemble|bundle)Release/ }
    if (wantsRelease && !keystorePropertiesFile.exists() && !project.hasProperty('android.injected.signing.store.file')) {
        throw new GradleException("shell/android/key.properties 없음 — 서명 없이 릴리스를 굽지 않는다 (storeFile·storePassword·keyAlias·keyPassword 필요, 정본: docs/RELEASE.md)")
    }
    // 릴리스 웹 번들(GUNBBU_RELEASE=1 npm run build, 루트 scripts/check-release.mjs --mark)만 AAB로 나간다.
    // 그 없이 구운 번들은 시험 광고 단위 · 시험 결제가 열린 채 실린다. 앱에 실린 표식 파일이 없으면 막는다.
    // 일부러 굽는 내부 시험만 -PallowDevWeb. 웹 빌드 뒤 `npx cap sync android` 도 해야 표식이 앱에 들어온다.
    if (wantsRelease && !project.hasProperty('allowDevWeb') && !file('src/main/assets/public/release-build.txt').exists()) {
        throw new GradleException("앱에 실린 웹 번들에 release-build.txt 가 없다 — GUNBBU_RELEASE=1 로 웹 빌드(npm run web:build) 후 npx cap sync android 를 하거나, 일부러 굽는 거라면 -PallowDevWeb (정본: docs/RELEASE.md)")
    }
    // 테스트 AdMob 앱 ID(발행자 3940256099942544)를 단 채 릴리스가 나가면 Play 심사·수익 단계에서야 발각된다.
    // 디버그 빌드는 막지 않는다. 일부러 테스트 ID로 릴리스를 굽는 경우(내부 시험 등)만 -PallowTestAds 로 우회.
    if (wantsRelease && !project.hasProperty('allowTestAds')) {
        def manifestText = file('src/main/AndroidManifest.xml').text
        def adId = (manifestText =~ /APPLICATION_ID"[^>]*value="([^"]*)"/)
        if (adId.find() && adId.group(1).contains('3940256099942544')) {
            throw new GradleException("AndroidManifest 의 AdMob 앱 ID가 Google 테스트 값이다 (${adId.group(1)}) — 실 앱 ID로 바꾸거나, 일부러 굽는 거라면 -PallowTestAds (정본: docs/RELEASE.md)")
        }
    }
}

android {
    namespace = "com.zaballgam.gunbbu"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zaballgam.gunbbu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
