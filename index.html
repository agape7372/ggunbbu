  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preload" href="./fonts/display.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/ui-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/ui-500.woff2" as="font" type="font/woff2" crossorigin />
  <title>건뿌!! GUNBBU</title>
  <style>
    /* 스플래시·뷰포트 셸 — style.css보다 먼저 그린다. 네이티브 스플래시(아이보리 + 표식)와 같은 그림이라 이음매가 안 보인다. */
    html:root {
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      min-height: 100dvh;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F4F1E8;
      color: #1A1A20;
      font-family: system-ui, sans-serif;
    }
    #boot-splash .boot-mark {
      width: 112px;
      height: 112px;
    }
    #boot-splash .boot-msg {
      min-height: 1.4em;
      font-size: 13px;
    }
    @media (display-mode: standalone), (display-mode: fullscreen) {
      html:root {
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img class="boot-mark" src="./icons/icon-192.png" width="112" height="112" alt="건뿌" />
    <p class="boot-msg" data-boot-msg></p>
    <noscript>JavaScript가 필요합니다.</noscript>
  </div>
  <div id="app">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud-layer" class="ui-layer"></div>
      <div id="touch-layer"></div>
      <div id="overlay-layer" class="ui-layer"></div>
    </div>
  </div>
  <script type="module">
    const splash = document.getElementById('boot-splash');
    const pingFit = () => window.dispatchEvent(new Event('resize'));
    window.visualViewport?.addEventListener('resize', pingFit);
    window.addEventListener('orientationchange', pingFit);
    import('/src/main.ts').then(
      () => { splash?.remove(); },
      () => {
        if (!splash) return;
        splash.classList.add('is-error');
        const el = splash.querySelector('[data-boot-msg]');
        if (el) el.textContent = '불러오지 못했습니다. 새로고침 해 주세요.';
      },
    );
  </script>
</body>
</html>
