<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta name="description" content="하늘에서 떨어지는 건물을 부수는 B급 철거 액션" />
  <meta name="theme-color" content="#F4F1E8" />
  <meta name="application-name" content="건뿌" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="건뿌" />
  <meta name="format-detection" content="telephone=no" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="건뿌!! GUNBBU" />
  <meta property="og:description" content="하늘에서 떨어지는 건물을 부수는 B급 철거 액션" />
  <meta property="og:url" content="https://agape7372.github.io/ggunbbu/" />
  <meta property="og:image" content="https://agape7372.github.io/ggunbbu/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="건뿌!! GUNBBU" />
  <meta name="twitter:description" content="하늘에서 떨어지는 건물을 부수는 B급 철거 액션" />
  <meta name="twitter:image" content="https://agape7372.github.io/ggunbbu/icons/icon-512.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="preload" href="./fonts/display.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/brush.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/body-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/body-700.woff2" as="font" type="font/woff2" crossorigin />
  <title>건뿌!! GUNBBU</title>
  <style>
    /* 스플래시·뷰포트 셸 — style.css보다 먼저 그린다. 네이티브 스플래시(아이보리 + 표식)와 같은 그림이라 이음매가 안 보인다. */
    html:root {
      height: 100%;
      height: -webkit-fill-available;
      height: 100dvh;
      min-height: 100dvh;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #F4F1E8;
      color: #1A1A20;
      font-family: system-ui, sans-serif;
    }
    #boot-splash .boot-mark {
      width: 112px;
      height: 112px;
    }
    #boot-splash .boot-msg {
      min-height: 1.4em;
      font-size: 13px;
    }
    @media (display-mode: standalone), (display-mode: fullscreen) {
      html:root {
        height: 100dvh;
      }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <img class="boot-mark" src="./icons/icon-192.png" width="112" height="112" alt="건뿌" />
    <p class="boot-msg" data-boot-msg></p>
    <noscript>JavaScript가 필요해요.</noscript>
  </div>
  <!-- 「먹 한 획」 공용 그림: 거친 붓 가장자리 필터 둘 + 작은 글리프 셋 (src/ui/ink.ts 머리말) -->
  <svg class="ink-defs" aria-hidden="true" focusable="false">
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.085" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <symbol id="g-life" viewBox="0 0 16 22"><circle cx="8" cy="5" r="4"/><path d="M8 9 L8 16 M4 21 L8 16 L12 21 M3 12 L13 12"/></symbol>
  </svg>
  <div id="rotate-hint" role="alert">
    <div class="rotate-body">
      <svg class="rotate-ic" viewBox="0 0 48 48" aria-hidden="true"><path d="M15 3 L33 4 L34 45 L14 44 Z"/><path d="M21 38 L27 38"/></svg>
      <span class="rotate-seal">세로로 돌려 주세요</span>
      <p>철거는 세로로 한다.</p>
    </div>
  </div>
  <div id="app">
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="hud-layer" class="ui-layer"></div>
      <div id="touch-layer"></div>
      <div id="overlay-layer" class="ui-layer"></div>
    </div>
  </div>
  <script type="module">
    const splash = document.getElementById('boot-splash');
    const pingFit = () => window.dispatchEvent(new Event('resize'));
    window.visualViewport?.addEventListener('resize', pingFit);
    window.addEventListener('orientationchange', pingFit);
    import('/src/main.ts').then(
      () => { splash?.remove(); },
      () => {
        if (!splash) return;
        splash.classList.add('is-error');
        const el = splash.querySelector('[data-boot-msg]');
        if (el) el.textContent = '불러오지 못했어요. 새로고침해 주세요.';
      },
    );
  </script>
</body>
</html>
