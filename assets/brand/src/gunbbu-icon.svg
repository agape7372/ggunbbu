<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- 건뿌 앱 아이콘 원본 · 「먹 한 획」(2026-10-31). 먹 빌딩을 사선 한 획이 갈라 위쪽이 미끄러지고, 베인 틈에만 참격 노랑. 주홍 낙관 하나(「뿌」).
     색 = 한지 #F4F1E8 · 먹 #1A1A20 · 주홍 #C4301E · 노랑 #FFD200 만. 그라데이션 · 흐림 · 반투명 없음. 거친 가장자리 = #rough(UI index.html #rough와 같은 방식).
     그림(#place 안)은 중심에서 반지름 215 안에 있다 → 배치 배율은 scripts/gen-native-icons.mjs가 정한다(any 1 · maskable 0.95 · 적응형 전경 0.727).
     #holes = 한지색 칸(창문 · 낙관 글자 · 테두리)을 투명 구멍으로 뚫는 마스크(한지색만 검정이 되는 #art 사본, 먹 · 주홍 · 노랑의 알파는 그대로). 적응형 전경 전용(배경 층이 같은 한지색이라 색은 같고, 테마 아이콘 단색판에 창문이 남는다).
     다시 굽기: scripts/gen-native-icons.mjs(인자는 그 파일 머리말) -->
