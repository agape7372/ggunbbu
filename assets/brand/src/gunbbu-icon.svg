<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- 건뿌 앱 아이콘 원본 · 「머리 위의 빌딩」(2026-11-24 주인 선택 G, 시안 = assets/icon-drafts/round3). 떨어지는 먹 빌딩의 밑면을 작은 졸라맨이 칼을 치켜들어 긋고, 노랑 칼빛 아래로 벽돌 조각이 튄다. 주홍 낙관 하나(「뿌」).
     화법은 옛 판(「먹 한 획」 2026-10-31, 베인 빌딩)과 같다: 색 = 한지 #F4F1E8 · 먹 #1A1A20 · 주홍 #C4301E · 노랑 #FFD200 만. 그라데이션 · 흐림 · 반투명 없음. 거친 가장자리 = #rough.
     그림(#place 안)은 중심에서 반지름 215 안에 있다(그림 묶음 배율 0.8919806481932466) → 배치 배율은 scripts/gen-native-icons.mjs가 정한다(any 1 · maskable 0.95 · 적응형 전경 0.727).
     #holes = 한지색 칸(창문 · 낙관 글자 · 테두리)을 투명 구멍으로 뚫는 마스크. 적응형 전경 · 테마 아이콘(monochrome = 전경 재사용) 전용.
     그림을 고치려면 assets/icon-drafts/round3/make.mjs의 G()를 고치고 이 파일로 옮긴 뒤 scripts/gen-native-icons.mjs로 다시 굽는다 -->
